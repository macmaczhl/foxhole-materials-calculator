name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@v7

      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build
        env:
          CI_BUILD_FOR_E2E: "true"

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - *checkout-code
      - *setup-node

      - &restore-cache-node_modules
        name: Restore node_modules
        id: restore-node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - &install-if-restore-miss
        name: Install dependencies
        if: steps.restore-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run linter
        run: npm run lint

      # - name: Check formatting
      #   run: npm run format:check

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - *checkout-code
      - *setup-node
      - *restore-cache-node_modules
      - *install-if-restore-miss

      - name: Run tests with coverage
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - *checkout-code
      - *setup-node
      - *restore-cache-node_modules
      - *install-if-restore-miss

      - name: Download static export
        uses: actions/download-artifact@v8
        with:
          name: static-export
          path: out

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      # Browser binaries only. GitHub Ubuntu runners already include Chromium's
      # system libraries; install-deps/--with-deps re-run apt on every job.
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10
